name: 客户端安装包

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: 选择构建平台
        required: true
        default: all
        type: choice
        options: [all, android, ios, macos, windows, linux]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.3'
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY || 'EmpeSLtZms6Uz7D61o6E3gQzBytIPqsNU+dSq47M9ko=' }}
  UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL || 'https://xingchenwa.github.io/qqm_project' }}
  UPDATE_CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'beta' || 'stable') || '' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test tool/tests/github_release.test.mjs tool/tests/github_site_sync.test.mjs tool/tests/gitcode_release.test.mjs tool/tests/gitcode_transport.test.mjs tool/tests/package_names.test.mjs
      - name: 检查标签、构建号和更新密钥
        run: node tool/github_release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}

  android:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 准备含版本号的安装包名称
        id: packages
        run: node tool/package_names.mjs github-output
      - name: 安装固定版本 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s/bin\n' "$RUNNER_TEMP/flutter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: 使用 JDK 17
        run: flutter config --jdk-dir "$JAVA_HOME_17_X64"
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency 2
      - name: 配置固定安卓签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
      - name: 构建安卓 APK（固定签名，V1/V2/V3）
        run: |
          flutter build apk --release --no-pub --build-name="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)" --dart-define="UPDATE_PUBLIC_KEY=$UPDATE_PUBLIC_KEY" --dart-define="UPDATE_BASE_URL=$UPDATE_BASE_URL" --dart-define="UPDATE_CHANNEL=$UPDATE_CHANNEL"
          mkdir -p dist
          cp -- build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.packages.outputs.android_file }}"
      - name: 保存 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.packages.outputs.android_artifact }}
          path: dist/${{ steps.packages.outputs.android_file }}
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 准备含版本号的安装包名称
        id: packages
        run: node tool/package_names.mjs github-output
      - name: 安装固定版本 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s/bin\n' "$RUNNER_TEMP/flutter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency 2
      - name: 编译 Universal macOS 应用并打包 DMG
        run: bash scripts/build_macos_package.sh
      - name: 保存 macOS 安装包（临时签名，未公证）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.packages.outputs.macos_artifact }}
          path: |
            dist/${{ steps.packages.outputs.macos_file }}
            dist/${{ steps.packages.outputs.macos_zip }}
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 准备含版本号的安装包名称
        id: packages
        run: node tool/package_names.mjs github-output
      - name: 安装固定版本 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s/bin\n' "$RUNNER_TEMP/flutter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency 2
      - name: 编译 iPhone 真机应用并打包未签名 IPA
        run: bash scripts/build_unsigned_ipa.sh
      - name: 保存未签名 IPA（安装前必须重新签名）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.packages.outputs.ios_artifact }}
          path: dist/${{ steps.packages.outputs.ios_file }}
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 准备含版本号的安装包名称
        id: packages
        run: node tool/package_names.mjs github-output
      - name: 安装固定版本 Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency 2
      - name: 准备 Inno Setup
        shell: pwsh
        run: ./tool/prepare_inno.ps1
      - name: 构建 Windows 安装包
        shell: pwsh
        run: |
          ./tool/build_windows_release.ps1 `
            -UpdatePublicKey "$env:UPDATE_PUBLIC_KEY" `
            -UpdateBaseUrl "$env:UPDATE_BASE_URL" `
            -Installer `
            -Iscc "./build/tools/inno-6.7.3/ISCC.exe"
      - name: 保存 Windows 安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.packages.outputs.windows_artifact }}
          path: |
            dist/qqbotmanager-windows-*.zip
            dist/qqbotmanager-windows-*-setup.exe
            dist/qqbotmanager-windows-*-build-info.json
          if-no-files-found: error
          retention-days: 7


  linux:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 准备含版本号的服务包名称
        id: packages
        run: node tool/package_names.mjs github-output
      - name: 安装固定版本 Flutter / Dart SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s/bin\n' "$RUNNER_TEMP/flutter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - name: 验证无桌面环境内核与网页登录安全
        run: dart run tool/server_smoke.dart
      - name: 验证 Linux 安装器的校验与路径保护
        run: node --test tool/tests/linux_installer.test.mjs
      - name: 安装固定版本浏览器测试工具
        run: |
          npm install --prefix "$RUNNER_TEMP/qqm-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/qqm-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: 验证电脑和手机网页的真实交互
        run: node tool/tests/server_browser.mjs
        env:
          QQM_PLAYWRIGHT: ${{ runner.temp }}/qqm-browser/node_modules/playwright
      - name: 编译并验证 Ubuntu / Debian / Rocky Linux 服务包
        run: bash scripts/build_linux_server.sh
      - name: 保存 Linux 网页服务包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.packages.outputs.linux_artifact }}
          path: |
            dist/${{ steps.packages.outputs.linux_file }}
            dist/${{ steps.packages.outputs.linux_checksum }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, android, ios, macos, windows, linux]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: project-website-sync
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 检出同仓库的网站分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs
          path: build/website
          persist-credentials: true
      - name: 发布到当前 Release，再同步 docs 首页下载资料
        run: node tool/github_release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_DIRECTORY: build/website
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}

  gitcode:
    name: 同步 GitCode 国内安装包与签名清单
    needs: publish
    # A release can explicitly delegate its mirror to the local publisher.
    # This avoids concurrent cloud/local writes without interrupting builds.
    if: github.event_name == 'release' && !contains(github.event.release.body, '<!-- qqm-gitcode-local -->')
    concurrency:
      group: project-gitcode-sync
      cancel-in-progress: false
    # Keep upload/network failures separate from compilation/Pages. The manual
    # mirror workflow can choose an alternate runner without rebuilding.
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 按 GitHub 正式／Beta 类型同步，读回校验后标记完成
        run: node tool/mirror_github_release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          UPDATE_PUBLIC_KEY: ${{ env.UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
