name: 客户端安装包

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: 选择构建平台
        required: true
        default: all
        type: choice
        options: [all, android, ios, macos, windows]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.3'
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY || 'EmpeSLtZms6Uz7D61o6E3gQzBytIPqsNU+dSq47M9ko=' }}
  UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL || 'https://xingchenwa.github.io/qqm_project' }}

jobs:
  preflight:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test tool/tests/github_release.test.mjs
      - name: 检查标签、构建号和更新密钥
        run: node tool/github_release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}

  android:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装固定版本 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s/bin\n' "$RUNNER_TEMP/flutter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: 使用 JDK 17
        run: flutter config --jdk-dir "$JAVA_HOME_17_X64"
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: 配置固定安卓签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
      - name: 构建安卓 APK（固定签名，V1/V2/V3）
        run: flutter build apk --release --no-pub --dart-define="UPDATE_PUBLIC_KEY=$UPDATE_PUBLIC_KEY" --dart-define="UPDATE_BASE_URL=$UPDATE_BASE_URL"
      - name: 保存 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装固定版本 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s/bin\n' "$RUNNER_TEMP/flutter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: 编译 Universal macOS 应用并打包 DMG
        run: bash scripts/build_macos_package.sh
      - name: 保存 macOS 安装包（临时签名，未公证）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal-packages
          path: |
            dist/qqbotmanager-macos-universal.dmg
            dist/qqbotmanager-macos-universal.zip
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装固定版本 Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s/bin\n' "$RUNNER_TEMP/flutter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: 编译 iPhone 真机应用并打包未签名 IPA
        run: bash scripts/build_unsigned_ipa.sh
      - name: 保存未签名 IPA（安装前必须重新签名）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned-ipa
          path: dist/qq_bot_manager-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: preflight
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装固定版本 Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: 准备 Inno Setup
        shell: pwsh
        run: ./tool/prepare_inno.ps1
      - name: 构建 Windows 安装包
        shell: pwsh
        run: |
          ./tool/build_windows_release.ps1 `
            -UpdatePublicKey "$env:UPDATE_PUBLIC_KEY" `
            -UpdateBaseUrl "$env:UPDATE_BASE_URL" `
            -Installer `
            -Iscc "./build/tools/inno-6.7.3/ISCC.exe"
      - name: 保存 Windows 安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-packages
          path: |
            dist/qqbotmanager-windows-*.zip
            dist/qqbotmanager-windows-*-setup.exe
            dist/qqbotmanager-windows-*-build-info.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, android, ios, macos, windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 四端校验、签名并上传 GitHub Release
        run: node tool/github_release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/github-pages
      - name: 发布下载首页与更新清单
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
