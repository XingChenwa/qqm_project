name: 同步 GitCode 国内更新节点
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的正式 GitHub Release 标签，例如 v1.3.8
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: project-website-sync
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 读取原签名版本并同步，不重新构建
        run: node tool/mirror_github_release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
