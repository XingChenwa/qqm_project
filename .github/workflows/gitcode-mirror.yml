name: 同步 GitCode 国内更新节点
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的 GitHub Release 标签，例如 v1.3.8 或 v1.3.8-beta.1
        required: true
        type: string
      runner:
        description: 上传节点（可在不同网络环境间切换）
        default: macos-15
        type: choice
        options: [macos-15, ubuntu-24.04]
permissions:
  contents: read
concurrency:
  group: project-website-sync
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 读取原签名版本并同步，不重新构建
        run: node tool/mirror_github_release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
