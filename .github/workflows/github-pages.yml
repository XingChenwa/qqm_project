name: 刷新网站下载与更新清单

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: project-website-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 检出同仓库的网站分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs
          path: build/website
          persist-credentials: true
      - name: 校验插件文档渲染器
        run: |
          npm --prefix tool/site_docs ci --ignore-scripts --no-audit --no-fund
          npm --prefix tool/site_docs test
          node tool/site_docs/render.mjs --check
        env:
          WEBSITE_DIRECTORY: build/website
      - run: node --test tool/tests/github_release.test.mjs tool/tests/github_site_sync.test.mjs
        env:
          WEBSITE_DIRECTORY: build/website
      - name: 同步已签名版本并请求 Pages 构建（不覆盖网站源码）
        run: node tool/github_release.mjs pages
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_DIRECTORY: build/website
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY || 'EmpeSLtZms6Uz7D61o6E3gQzBytIPqsNU+dSq47M9ko=' }}
