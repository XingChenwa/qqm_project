# 合并到宝塔现有 server 块，保留 HTTPS 证书和续期配置。
# 网站根目录只能是 public；PHP socket 按宝塔选用的版本调整。
# 如果已包含 enable-php-82.conf，请用下面的 PHP location 替代，不能重复定义。
root /www/wwwroot/botmanager.uuze.cn/public;
index index.php;
client_max_body_size 1024m;
client_body_timeout 300s;

# 用这一行替换宝塔原有的 access_log 指令，不要额外保留旧日志。
# 不记录携带 OAuth code/state 的完整请求。若需要访问日志，使用不含参数的安全日志格式。
access_log off;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location /assets/ {
    try_files $uri =404;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
}

# 回调直接进入控制器，不经过会重新启用日志的内部重定向。
location = /api/admin/oauth/callback {
    access_log off;
    error_log /dev/null crit;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param QQM_PROXY_ADDR $remote_addr;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_read_timeout 60s;
    fastcgi_no_cache 1;
}

location ~ \.php$ {
    if ($uri != /index.php) { return 404; }
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    # 不启用 real_ip 模块时，此值是原始 TCP 对端。
    # 如果已有 real_ip 模块重写 remote_addr，这里改用 $realip_remote_addr（上面回调处也改）。
    fastcgi_param QQM_PROXY_ADDR $remote_addr;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_read_timeout 300s;
    fastcgi_no_cache 1;
}

location ~ /\. { deny all; }
location ~* ^/(data|src|bin|tests|deploy|database)(/|$) { deny all; }
location ~* \.(sql(?:\.gz)?|sqlite|db|dump|json\.bak|env|ini|log|bak)$ { deny all; }

# PHP 配置（宝塔 PHP 设置中填写，不是 Nginx 指令）：
# upload_max_filesize = 1024M
# post_max_size = 1030M
# max_execution_time = 300
# display_errors = Off
# session.save_path 使用非公开、仅 PHP 用户可读写的目录。
