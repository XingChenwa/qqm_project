name: qq_bot_manager
description: QQ 机器人管理器 - 跨平台 QQ 官方机器人桌面管理工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Networking
  dio: ^5.9.2
  web_socket_channel: ^3.0.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  # UI components
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  yaml: ^3.1.3
  logging: ^1.3.0
  path: ^1.9.1
  collection: ^1.19.1

  # Desktop support
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - plugins/
