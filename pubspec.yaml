name: qq_bot_manager
description: QQ 机器人管理器 - 跨平台 QQ 官方机器人桌面管理工具
publish_to: 'none'
version: 1.3.8-beta.6+25

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  qqm_plugins:
    path: plugins

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Networking
  dio: ^5.9.2
  web_socket_channel: ^3.0.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  # UI components
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  image: ^4.5.4
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  yaml: ^3.1.3
  logging: ^1.3.0
  path: ^1.9.1
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: ^2.7.0
  hetu_script: 0.6.4

  # Desktop support
  window_manager: ^0.5.1
  tray_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: 2.4.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/branding/logo.png
  image_path: assets/branding/logo.png
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/logo.png
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/updater/windows-update.ps1
    - assets/branding/logo.png
    - assets/branding/tray.ico
    - plugins/index.json
    - plugins/example_plugin/plugin.json
    - plugins/weather_plugin/plugin.json
    - plugins/dice_plugin/plugin.json
    - plugins/translate_comment/plugin.json
    - plugins/daily_club/plugin.json
    - plugins/group_games/plugin.json
    - plugins/group_authorization/plugin.json
    - plugins/example_plugin/main.ht
    - plugins/weather_plugin/main.ht
    - plugins/dice_plugin/main.ht
    - plugins/translate_comment/main.ht
    - plugins/daily_club/main.ht
    - plugins/group_games/main.ht
    - plugins/group_authorization/main.ht
    - plugins/examples/hello_script/plugin.json
    - plugins/examples/hello_json/plugin.json
    - plugins/examples/hello_yaml/plugin.yaml
    - plugins/examples/http_echo/plugin.json
    - plugins/examples/buttons/plugin.json
    - plugins/examples/media/plugin.json
    - docs/plugin-development.md
